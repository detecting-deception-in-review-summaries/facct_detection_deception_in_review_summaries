[project]
name = "deception-detection-review-summaries"
version = "0.2.0"
description = "Code and data for Detecting Deception in Product Review Summaries"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "ipykernel>=7,<8",
  "jupyterlab>=4,<5",
  "matplotlib>=3.9,<4",
  "nltk>=3.9,<4",
  "numpy",
  "pandas>=2.2,<3",
  "pyarrow>=18,<24",
  "PyYAML>=6,<7",
  "scipy>=1.14,<2",
  "seaborn>=0.13,<1",
  "tqdm>=4.67,<5",
]

[project.optional-dependencies]
# Only for the code in src/pipeline/, which is not needed to reproduce the results.
pipeline = [
  "anthropic>=0.75,<1",
  "google-genai>=1.55,<2",
  "httpx",
  "modal>=1.3,<2",
  "openai>=2.14,<3",
  "openpyxl>=3.1.5",
  "penman==1.3.1",
  "pydantic>=2.10,<3",
  "python-dotenv>=1.1,<2",
]
